name: Release
on:
  push:
    tags:
      - v*

env:
  DOKUSHO_GITHUB_RELEASE: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  get_tag:
    if: github.repository == 'Globeeeee/dokusho'
    name: Extract tag name
    runs-on: 'ubuntu-26.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'Globeeeee/dokusho'
    name: Build
    runs-on: 'ubuntu-26.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "TELEMETRY_FLAG=" >> "$GITHUB_ENV"
          else
            echo "No GOOGLE_SERVICES_JSON secret, building without telemetry"
            echo "TELEMETRY_FLAG=-Pinclude-telemetry=false" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: ./gradlew assembleRelease -Pdist=github $TELEMETRY_FLAG
        env:
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release.apk dokusho-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release.apk dokusho-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release.apk dokusho-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release.apk dokusho-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release.apk dokusho-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dokusho
          path: |
            dokusho-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-x86-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  build_foss:
    if: github.repository == 'Globeeeee/dokusho'
    name: Build (FOSS)
    runs-on: ubuntu-26.04
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true

      - name: Decode signing keystore
        run: echo "$SIGNING_KEY" | base64 -d > "${{ runner.temp }}/release.keystore"
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Build
        run: ./gradlew assembleFoss -Pdist=foss
        env:
          storeFile: ${{ runner.temp }}/release.keystore
          storePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias: ${{ secrets.ALIAS }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/foss/app-universal-foss.apk dokusho-${{ needs.get_tag.outputs.tag }}-foss.apk

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dokusho-foss
          path: dokusho-${{ needs.get_tag.outputs.tag }}-foss.apk

  release:
    if: github.repository == 'Globeeeee/dokusho'
    name: Create GitHub Release
    runs-on: ubuntu-26.04
    needs: [get_tag, build, build_foss]

    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/releases

      - name: Release notes
        run: |
          set -e
          tag="${{ needs.get_tag.outputs.tag }}"
          notes="docs/releases/${tag}.md"
          {
            echo "# Dokusho ${tag}"
            echo
            if [ -f "$notes" ]; then
              cat "$notes"
            else
              echo "See [docs/PLAN.md](https://github.com/Globeeeee/dokusho/blob/main/docs/PLAN.md) for what this version can do."
            fi
            echo
            echo "> [!TIP]"
            echo ">"
            echo "> ### If you are unsure which version to download then go with \`dokusho-${tag}.apk\`"
          } > release-notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          failOnError: false
          name: |
            dokusho
            dokusho-foss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Dokusho ${{ needs.get_tag.outputs.tag }}
          body_path: release-notes.md
          files: |
            dokusho-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-${{ needs.get_tag.outputs.tag }}-foss.apk
            dokusho-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-x86-${{ needs.get_tag.outputs.tag }}.apk
            dokusho-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
